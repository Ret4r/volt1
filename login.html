<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Вхід до кабінету — ВольтЗапас</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/logo.svg" alt="">ВольтЗапас</a>
    <a class="toplink" href="/">До магазину</a>
  </header>
  <main class="shell">
    <section class="card">
      <h1>Вхід до кабінету</h1>
      <p class="intro muted">Увійдіть, щоб переглянути свої замовлення.</p>
      <form id="loginForm" class="form">
        <div class="field-wrap">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field-wrap">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
        <button class="button" type="submit">Увійти</button>
      </form>
      <div class="row" style="margin-top:16px">
        <a id="showReset" href="#reset">Забули пароль?</a>
        <a href="/register">Створити акаунт</a>
      </div>
      <section id="resetSection" class="hidden">
        <div class="divider"></div>
        <h2 style="margin:0;color:#f8fafc;font-size:19px">Скидання пароля</h2>
        <p class="muted" style="margin:6px 0 16px">Отримайте одноразовий код на email.</p>
        <form id="resetForm" class="form">
          <div class="field-wrap">
            <label for="resetEmail">Email</label>
            <input id="resetEmail" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <button id="sendCode" class="button secondary" type="button">Надіслати код</button>
          <div id="resetFields" class="form hidden">
            <div class="field-wrap">
              <label for="resetCode">Код з листа</label>
              <input id="resetCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
            </div>
            <div class="field-wrap">
              <label for="newPassword">Новий пароль</label>
              <input id="newPassword" type="password" autocomplete="new-password" minlength="8">
            </div>
            <button class="button" type="submit">Змінити пароль</button>
          </div>
          <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>
  <script>
    const request = async (url, body) => {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Сталася помилка');
      return data;
    };
    const message = (id, text, success = false) => {
      const element = document.getElementById(id);
      element.textContent = text;
      element.classList.toggle('success', success);
    };
    const redirectAfterLogin = () => {
      const next = new URLSearchParams(location.search).get('next');
      if (next && next.startsWith('/')) {
        const target = new URL(next, location.origin);
        if (target.origin === location.origin && !next.startsWith('//')) {
          location.assign(`${target.pathname}${target.search}${target.hash}`);
          return;
        }
      }
      location.assign('/account');
    };

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      message('loginMessage', '');
      try {
        await request('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        redirectAfterLogin();
      } catch (error) {
        message('loginMessage', error.message);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('showReset').addEventListener('click', event => {
      event.preventDefault();
      document.getElementById('resetSection').classList.toggle('hidden');
    });

    document.getElementById('sendCode').addEventListener('click', async event => {
      const button = event.currentTarget;
      button.disabled = true;
      message('resetMessage', '');
      try {
        const result = await request('/api/auth/forgot-password', {
          email: document.getElementById('resetEmail').value
        });
        document.getElementById('resetFields').classList.remove('hidden');
        message('resetMessage', result.message, true);
      } catch (error) {
        message('resetMessage', error.message);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (document.getElementById('resetFields').classList.contains('hidden')) return;
      const button = event.currentTarget.querySelector('[type="submit"]');
      button.disabled = true;
      message('resetMessage', '');
      try {
        const result = await request('/api/auth/reset-password', {
          email: document.getElementById('resetEmail').value,
          code: document.getElementById('resetCode').value,
          password: document.getElementById('newPassword').value
        });
        message('resetMessage', result.message, true);
        document.getElementById('loginMessage').textContent = 'Пароль змінено. Увійдіть із новим паролем.';
      } catch (error) {
        message('resetMessage', error.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
