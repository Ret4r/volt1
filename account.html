<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Особистий кабінет — ВольтЗапас</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/logo.svg" alt="">ВольтЗапас</a>
    <div class="actions">
      <a class="toplink" href="/">До магазину</a>
      <button id="logout" class="button secondary" type="button" style="min-height:38px;padding:7px 12px">Вийти</button>
    </div>
  </header>
  <main class="shell wide">
    <section class="card">
      <div class="row">
        <div>
          <h1>Особистий кабінет</h1>
          <p id="accountName" class="intro muted" style="margin-bottom:0">Завантаження профілю…</p>
        </div>
        <a class="button" href="/" style="display:inline-flex;align-items:center">До покупок</a>
      </div>
      <div class="divider"></div>
      <div class="row">
        <h2 style="margin:0;color:#f8fafc;font-size:20px">Мої замовлення</h2>
        <button id="refreshOrders" class="button secondary" type="button" style="min-height:38px;padding:7px 12px">Оновити</button>
      </div>
      <p id="ordersMessage" class="message" role="status" aria-live="polite"></p>
      <div id="orders" class="orders"></div>
    </section>
  </main>
  <script>
    const statusNames = {
      new: 'Нове',
      pending: 'Нове',
      processing: 'Збирається',
      shipped: 'Відправлено',
      completed: 'Виконано',
      cancelled: 'Скасовано'
    };

    async function getJson(url) {
      const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw Object.assign(new Error(data.error || 'Не вдалося завантажити дані'), { status: response.status });
      return data;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function orderItems(value) {
      let items = value;
      if (typeof items === 'string') {
        try { items = JSON.parse(items); } catch { return items; }
      }
      if (!Array.isArray(items)) return typeof items === 'string' ? items : '';
      return items.map(item => {
        const name = item.name || item.title || 'Товар';
        const quantity = Number(item.qty || item.quantity || 1);
        return `${name} × ${quantity}`;
      }).join(', ');
    }

    function renderOrders(orders) {
      const root = document.getElementById('orders');
      root.replaceChildren();
      if (!orders.length) {
        root.append(element('p', 'empty', 'У вас поки немає замовлень. Оформіть перше замовлення в магазині.'));
        return;
      }

      for (const order of orders) {
        const card = element('article', 'order');
        const head = element('div', 'order-head');
        const number = element('span', 'order-number', `Замовлення №${order.id}`);
        const status = element('span', 'badge', statusNames[order.status] || 'Нове');
        head.append(number, status);
        card.append(head);

        const date = order.created_at ? new Date(order.created_at).toLocaleString('uk-UA') : '';
        if (date) card.append(element('p', 'muted', date));

        const items = orderItems(order.items);
        if (items) card.append(element('p', 'order-details', items));
        const amount = new Intl.NumberFormat('uk-UA', { style: 'currency', currency: 'UAH', maximumFractionDigits: 0 })
          .format(Number(order.total_price) || 0);
        card.append(element('p', 'order-details', `Сума: ${amount}`));
        root.append(card);
      }
    }

    async function loadOrders() {
      const button = document.getElementById('refreshOrders');
      button.disabled = true;
      document.getElementById('ordersMessage').textContent = '';
      try {
        const data = await getJson('/api/orders');
        renderOrders(data);
      } catch (error) {
        if (error.status === 401) {
          location.replace('/login?next=%2Faccount');
          return;
        }
        document.getElementById('ordersMessage').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    async function start() {
      try {
        const data = await getJson('/api/auth/me');
        document.getElementById('accountName').textContent = `${data.user.full_name} · ${data.user.email}`;
        await loadOrders();
      } catch (error) {
        if (error.status === 401) {
          location.replace('/login?next=%2Faccount');
          return;
        }
        document.getElementById('accountName').textContent = error.message;
      }
    }

    document.getElementById('refreshOrders').addEventListener('click', loadOrders);
    document.getElementById('logout').addEventListener('click', async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        if (!response.ok) throw new Error('Вихід не виконано');
        location.replace('/login');
      } catch {
        button.disabled = false;
        document.getElementById('ordersMessage').textContent = 'Не вдалося вийти. Спробуйте ще раз.';
      }
    });

    start();
  </script>
</body>
</html>
